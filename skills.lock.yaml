# Реестр вендорных скиллов (Матемация).
# Источник правды по контенту: agent-skills/vendor/<vendor>/<skill>/.
# Обновление: клонировать репозиторий на новом коммите, пройти аудит
# (scripts/audit-skills.ps1 + ручной просмотр диффа), обновить commit и reviewed_at.
# Скиллы деплоя/миграций/платежей/секретов запускаются только с явным подтверждением человека.
#
# vendor_dir       — каталог в agent-skills/vendor, к которому относится источник.
# accepted_findings — базовая линия автоматического аудита
# (scripts/lib/supply_chain_scan.py): правила, срабатывания которых разобраны
# и приняты. Появление правила вне этого списка роняет skills-ci.ps1 —
# так новый опасный паттерн в обновлении не проходит молча.

skills:
  - name: anthropic-core            # skill-creator, frontend-design, webapp-testing, mcp-builder
    repository: anthropics/skills
    commit: "fa0fa64bdc967915dc8399e803be67759e1e62b8"
    reviewed_at: "2026-07-19"
    audit: "чисто; grep-аудит prompt-injection/exfiltration"
