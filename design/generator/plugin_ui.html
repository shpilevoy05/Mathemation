<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 20px; font: 13px/1.5 Inter, "Segoe UI", system-ui, sans-serif;
         color: #10162A; background: #FFFFFF; }
  @media (prefers-color-scheme: dark) { body { color: #E9EEFC; background: #1B1E28; } .hint { color: #98A2BE } .opt { border-color: #333846 } }
  h1 { font-size: 15px; margin: 0 0 4px; }
  .hint { color: #6B7590; font-size: 12px; margin: 0 0 16px; }
  .opt { display: flex; gap: 10px; align-items: flex-start; padding: 11px 12px; border: 1px solid #DCE3F6;
         border-radius: 10px; margin-bottom: 8px; cursor: pointer; }
  .opt input { margin: 2px 0 0; }
  .opt b { display: block; font-weight: 600; }
  .opt span { color: #6B7590; font-size: 11.5px; }
  button { width: 100%; margin-top: 12px; padding: 11px; border: 0; border-radius: 10px;
           background: #4F6BEA; color: #fff; font: 600 13px Inter, system-ui, sans-serif; cursor: pointer; }
  button:disabled { opacity: .55; cursor: default; }
  #status { margin-top: 12px; font-size: 12px; color: #6B7590; min-height: 18px; }
  #status.err { color: #D33A50; }
</style>
</head>
<body>
  <h1>Аватары, рамки и символы лиг</h1>
  <p class="hint">Плагин создаст новую страницу с компонентами, наборами вариантов и кадрами анимаций.</p>

  <label class="opt"><input type="checkbox" id="set" checked>
    <span><b>Основной набор</b><span>16 аватаров, 14 рамок, 16 знаков лиг — компоненты с вариантами</span></span></label>

  <label class="opt"><input type="checkbox" id="variants" checked>
    <span><b>Варианты знаков лиг</b><span>Формы пластин для Альфы и Сигмы + пять начертаний символов</span></span></label>

  <label class="opt"><input type="checkbox" id="anim" checked>
    <span><b>Кадры анимаций</b><span>11 концептов × 3 кадра со Smart Animate между ними</span></span></label>

  <button id="go">Собрать макет</button>
  <div id="status"></div>

<script>
  const $ = id => document.getElementById(id);
  $('go').onclick = () => {
    $('go').disabled = true;
    $('status').className = '';
    $('status').textContent = 'Собираю…';
    parent.postMessage({ pluginMessage: { type: 'build', opts: {
      set: $('set').checked, variants: $('variants').checked, anim: $('anim').checked
    } } }, '*');
  };
  onmessage = (e) => {
    const m = e.data.pluginMessage; if (!m) return;
    if (m.type === 'status') $('status').textContent = m.text;
    if (m.type === 'done') { $('status').textContent = 'Готово — макет на новой странице.'; $('go').disabled = false; }
    if (m.type === 'error') { $('status').className = 'err'; $('status').textContent = m.text; $('go').disabled = false; }
  };
</script>
</body>
</html>
