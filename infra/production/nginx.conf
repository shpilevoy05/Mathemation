# Точка входа снаружи. Три обязанности: TLS, статика и internal-локация для
# работ учеников. Всё остальное уходит в приложение.

upstream matemacia {
    server web:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Health-check балансировщика ходит по http и не должен попадать в редирект.
    location = /healthz { proxy_pass http://matemacia; }
    location = /readyz  { proxy_pass http://matemacia; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name matemacia.ru www.matemacia.ru;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Фото решения второй части: 10 МБ на файл в настройках приложения,
    # запас нужен на кодирование multipart.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    location /static/ {
        alias /srv/static/;
        # Имена файлов пока без хеша, поэтому кеш короткий и с проверкой.
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    location /media/ {
        alias /srv/media/;
        expires 1h;
    }

    # Работы учеников. `internal` означает: снаружи сюда попасть нельзя, только
    # по X-Accel-Redirect от приложения — то есть после проверки прав.
    # PRIVATE_MEDIA_NGINX_LOCATION в окружении должен совпадать с этим путём.
    location /private-media/ {
        internal;
        alias /srv/private-media/;
    }

    location / {
        proxy_pass http://matemacia;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Без X-Forwarded-Proto Django считает запрос http и уходит в
        # бесконечный редирект на https.
        proxy_set_header X-Forwarded-Proto $scheme;
        # По этому заголовку считается лимит попыток входа: подставлять его
        # клиенту нельзя, поэтому пишем адрес соединения, а не пересылаем чужой.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
