# Прод: приложение, воркер и расписание в контейнерах, база и Redis —
# управляемые сервисы облака. Их здесь нет намеренно: бэкапы, отказоустойчивость
# и обновления версии на стороне провайдера, а держать рядом ещё и свой Postgres
# означало бы две правды о том, где лежат данные.
#
# Запуск:
#   docker compose -f infra/production/docker-compose.yml --env-file .env.production run --rm release
#   docker compose -f infra/production/docker-compose.yml --env-file .env.production up -d

x-app: &app
  build:
    context: ../..
    dockerfile: infra/production/Dockerfile
  image: matemacia-app:${APP_VERSION:-latest}
  env_file: [../../.env.production]
  restart: unless-stopped
  volumes:
    # Работы учеников переживают пересоздание контейнера. Каталог приватный:
    # у файлов нет публичного URL, наружу они уходят только через проверку прав.
    - private-media:/app/private-media
    - media:/app/media
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  # Разовый прогон перед выкладкой: миграции и проверка прод-настроек.
  release:
    <<: *app
    command: ["/app/infra/production/entrypoint.sh", "release"]
    restart: "no"

  web:
    <<: *app
    command: ["/app/infra/production/entrypoint.sh", "web"]
    expose: ["8000"]
    volumes:
      - private-media:/app/private-media
      - media:/app/media
      - static:/app/staticfiles

  worker:
    <<: *app
    command: ["/app/infra/production/entrypoint.sh", "worker"]

  beat:
    <<: *app
    command: ["/app/infra/production/entrypoint.sh", "beat"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [web]
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/srv/static:ro
      - media:/srv/media:ro
      # internal-локация для X-Accel-Redirect: nginx отдаёт файл только после
      # того, как приложение проверило право на него.
      - private-media:/srv/private-media:ro
      - ./certs:/etc/nginx/certs:ro
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

volumes:
  static:
  media:
  private-media:
